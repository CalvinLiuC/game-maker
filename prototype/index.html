<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>翻倍引擎 · 最小原型</title>
<style>
:root{--bg:#0f1115;--panel:#181c24;--text:#e8e8e8;--muted:#8a90a0;--gold:#f5c542;--red:#ff4d4d;--green:#4ade80;--accent:#7c9cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-around;text-align:center;font-size:13px;color:var(--muted);padding-bottom:12px;border-bottom:1px solid #2a2f3a}
header b{display:block;color:var(--text);font-size:24px}
header .ok b{color:var(--green)}
.panel{background:var(--panel);border-radius:12px;padding:20px;margin-top:16px;text-align:center}
.stage{min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}
.big{font-size:110px;font-weight:800;line-height:1}
.big.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3);color:var(--gold)}100%{transform:scale(1)}}
.big.bust{color:var(--red);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.mult{color:var(--gold);font-size:22px;font-weight:700}
.hint{color:var(--muted);font-size:14px}
.btns{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;justify-content:center}
button{background:#262b36;color:var(--text);border:0;border-radius:12px;padding:16px 26px;font-size:20px;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button.primary{background:var(--accent);color:#000;font-weight:700}
button.danger{background:var(--red);color:#000;font-weight:700}
.cards{display:flex;gap:16px;justify-content:center;margin-top:12px}
.card{width:150px;background:#202530;border:2px solid #3a4152;border-radius:12px;padding:16px;cursor:pointer}
.card:hover{border-color:var(--accent);transform:translateY(-4px)}
.card .v{font-size:40px;font-weight:800}
.card .p{color:var(--muted)}
h2{margin:0 0 8px;font-size:22px}
.win{color:var(--green)} .lose{color:var(--red)}
table{width:100%;border-collapse:collapse;margin-top:8px;text-align:left}
td{padding:6px 4px;border-bottom:1px solid #2a2f3a}
td:last-child{text-align:right;font-weight:700}
.deck{color:var(--muted);font-size:12px;margin-top:12px}
</style>
</head>
<body><div id="app"></div>
<script>
// 规则一共四条：
// 1. 牌一张一张发给你，每张一个数字。加仓：按概率翻倍，失败归零。平仓：收下。
// 2. 每次加仓扣 1 本金。
// 3. 一份合约 = 把牌库打完一遍，凑够要求的点数。差多少扣多少本金；多出来的每 3 点回 1 本金。
// 4. 每份合约结束二选一，替换掉牌库里一张普通牌。牌库永远 9 张。8 份合约打完算赢，本金归零算输。

let CONTRACTS=[50,65,80,95,110,130,150,170];
let FEE=1,MAX_DOUBLES=5,START_CAPITAL=120,SURPLUS_DIV=3;
let POOL=[{base:16,prob:.4},{base:10,prob:.65},{base:12,prob:.5},{base:20,prob:.35},{base:6,prob:.75},{base:8,prob:.6}];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pct=p=>Math.round(p*100)+'%';
let S;

function newGame(){
  S={screen:'play',node:0,capital:START_CAPITAL,deck:Array.from({length:9},()=>({base:10,prob:.5})),
    pile:[],points:0,req:0,card:null,streak:0,
    stats:{busts:0,maxStreak:0,maxCard:0,fees:0,doubles:0,greedyOps:0,greedyDoubles:0}};
  startContract();
}
function startContract(){S.req=CONTRACTS[S.node];S.points=0;S.pile=shuffle([...S.deck]);S.screen='play';nextCard()}
function nextCard(){
  if(!S.pile.length){settle();return}
  const c=S.pile.pop();
  S.card={base:c.base,prob:c.prob,value:c.base,doubles:0,busted:false,done:false,fees:0,lost:0,anim:''};
  if(met())S.stats.greedyOps++;
  render();
}
function met(){return S.points+S.card.value>=S.req}
function doDouble(){
  const c=S.card;if(c.done||S.capital<=FEE)return;
  S.capital-=FEE;S.stats.fees+=FEE;c.fees+=FEE;S.stats.doubles++;
  if(met())S.stats.greedyDoubles++;
  if(Math.random()<c.prob){
    c.value*=2;c.doubles++;S.streak++;S.stats.maxStreak=Math.max(S.stats.maxStreak,S.streak);c.anim='pop';
    if(c.doubles>=MAX_DOUBLES)c.done=true;else if(met())S.stats.greedyOps++;
  }else{
    S.stats.busts++;S.streak=0;c.lost=c.value;c.value=0;c.busted=true;c.done=true;c.anim='bust';
  }
  render();
}
function cashOut(){
  const c=S.card;S.points+=c.value;S.stats.maxCard=Math.max(S.stats.maxCard,c.value);
  if(S.capital<=0){end('lose','本金归零');return}
  nextCard();
}
function settle(){
  const diff=S.points-S.req;
  S.settle={ok:diff>=0,loss:diff<0?-diff:0,gain:diff>0?Math.floor(diff/SURPLUS_DIV):0};
  S.capital+=S.settle.gain-S.settle.loss;
  if(S.capital<=0){S.capital=0;end('lose','本金归零');return}
  S.reward=shuffle([...POOL]).slice(0,2);S.screen='settle';render();
}
function pick(i){const k=S.deck.findIndex(d=>d.base===10&&d.prob===.5);S.deck[k<0?0:k]={...S.reward[i]};S.node++;if(S.node>=CONTRACTS.length)end('win','8 份合约全部完成');else startContract()}
function end(r,why){S.result=r;S.reason=why;S.screen='end';render()}

const el=document.getElementById('app');
function render(){
  const left=S.req-S.points;
  let h='<header><div>本金<b>'+S.capital+'</b></div><div>合约<b>'+(Math.min(S.node+1,8))+'/8</b></div><div class="'+(left<=0?'ok':'')+'">'+(left<=0?'已达标，多':'还差')+'<b>'+Math.abs(left)+'</b></div><div>剩余牌<b>'+(S.pile.length+(S.screen==='play'?1:0))+'</b></div></header>';
  if(S.screen==='play'){
    const c=S.card;let body;
    if(c.busted){
      body='<div class="big bust">爆仓</div><div class="hint">错失 '+c.lost+' 点 · 这张牌手续费付了 '+c.fees+'</div><div class="btns"><button class="primary" onclick="cashOut()">下一张</button></div>';
    }else{
      const canD=!c.done&&S.capital>FEE;
      body='<div class="big '+c.anim+'">'+c.value+'</div><div class="mult">×'+(c.value/c.base)+(c.done?' 已翻满':'')+'</div>'+
        '<div class="btns"><button class="danger" onclick="doDouble()"'+(canD?'':' disabled')+'>加仓 '+pct(c.prob)+' · −1 本金</button><button class="primary" onclick="cashOut()">平仓 '+c.value+'</button></div>'+
        (!canD&&!c.done?'<div class="hint">本金不够付手续费</div>':'');
    }
    c.anim='';
    h+='<div class="panel"><div class="stage"><div class="hint">这张牌 '+c.base+' 点 · 翻倍概率 '+pct(c.prob)+'</div>'+body+'</div></div>';
    h+='<div class="deck">牌库 '+S.deck.length+' 张：'+S.deck.map(d=>d.base+'<span style="opacity:.5">/'+pct(d.prob)+'</span>').join('　')+'</div>';
  }else if(S.screen==='settle'){
    const s=S.settle;
    h+='<div class="panel"><h2 class="'+(s.ok?'win':'lose')+'">'+(s.ok?'合约完成':'合约失败')+'</h2><div>点数 '+S.points+' / 要求 '+S.req+'</div><div class="hint">'+(s.ok?'多出 '+(S.points-S.req)+' 点，每 '+SURPLUS_DIV+' 点回 1 本金，回 '+s.gain:'差 '+s.loss+' 点，扣 '+s.loss+' 本金')+'</div>'+
      '<div style="margin-top:20px">二选一，替换掉牌库里一张普通牌（10 点 50%）</div><div class="cards">'+S.reward.map((r,i)=>'<div class="card" onclick="pick('+i+')"><div class="v">'+r.base+'</div><div class="p">翻倍 '+pct(r.prob)+'</div></div>').join('')+'</div></div>';
  }else{
    const st=S.stats;const greedy=st.greedyOps?Math.round(st.greedyDoubles/st.greedyOps*100)+'%':'无';
    h+='<div class="panel"><h2 class="'+S.result+'">'+(S.result==='win'?'你赢了':'本局结束')+'</h2><div class="hint">'+S.reason+'</div>'+
      '<table><tr><td>走到</td><td>合约 '+Math.min(S.node+1,8)+'</td></tr><tr><td>剩余本金</td><td>'+S.capital+'</td></tr><tr><td>最高单牌点数</td><td>'+st.maxCard+'</td></tr><tr><td>最大连翻</td><td>'+st.maxStreak+'</td></tr><tr><td>爆仓次数</td><td>'+st.busts+'</td></tr><tr><td>加仓总次数</td><td>'+st.doubles+'</td></tr><tr><td>手续费总支出</td><td>'+st.fees+'</td></tr><tr><td>贪心率（已达标后仍加仓）</td><td>'+greedy+'（'+st.greedyDoubles+'/'+st.greedyOps+'）</td></tr></table>'+
      '<div class="btns"><button class="primary" onclick="newGame()">再来一局</button></div></div>';
  }
  el.innerHTML=h;
}
newGame();
</script>
</body></html>
